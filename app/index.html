<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f1"><title>Sthree Vastras — Thoughtfully found</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#262520;--muted:#87857c;--paper:#f8f6f1;--white:#fffefa;--line:#eae7de;--green:#405b48;--leaf:#e5ebdf;--coral:#bc745b;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #788a64;outline-offset:2px}.hidden{display:none!important}.topline{height:35px;background:var(--green);color:#fff;text-align:center;font-size:11px;letter-spacing:.09em;display:grid;place-items:center}.header{height:78px;display:flex;align-items:center;gap:36px;padding:0 max(5vw,24px);background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{font-family:var(--serif);font-size:24px;white-space:nowrap;letter-spacing:-.03em;cursor:pointer}.brand span{color:var(--coral)}.nav{display:flex;gap:25px;align-items:center}.nav button,.linkbtn{border:0;background:none;color:#55554e;padding:9px 0;font-size:13px}.nav button:hover,.nav button.active{color:var(--green)}.search{margin-left:auto;position:relative;width:min(25vw,290px)}.search input{width:100%;border:1px solid var(--line);background:#f9f8f4;border-radius:5px;padding:11px 15px 11px 37px;font-size:12px}.search:before{content:'⌕';position:absolute;left:13px;top:6px;font-size:22px;color:#777}.header-actions{display:flex;gap:17px;align-items:center}.iconbtn{border:0;background:none;color:var(--ink);font-size:17px;position:relative;padding:7px}.count{position:absolute;right:0;top:0;background:var(--coral);color:#fff;border-radius:20px;font-size:9px;min-width:15px;height:15px;display:grid;place-items:center}.mobile-menu{display:none}.shell{max-width:1320px;margin:auto;padding:0 5vw}.hero{display:grid;grid-template-columns:1fr .9fr;background:#ebece4;min-height:335px;margin:30px 0 43px;border-radius:5px;overflow:hidden}.hero-copy{padding:56px 9% 48px;align-self:center}.eyebrow{text-transform:uppercase;letter-spacing:.17em;font-size:10px;color:var(--green);font-weight:700}.hero h1{font:500 clamp(34px,4vw,54px)/1.08 var(--serif);letter-spacing:-.03em;margin:14px 0}.hero p{font-size:13px;line-height:1.8;color:#66665e;max-width:370px;margin:0 0 23px}.btn{border:0;border-radius:3px;padding:12px 19px;background:var(--green);color:white;font-size:12px;font-weight:600;transition:.18s}.btn:hover{background:#314839;transform:translateY(-1px)}.btn.light{background:transparent;color:var(--green);border:1px solid #9ba994}.btn.dark{background:var(--ink)}.btn.small{padding:9px 13px}.hero-art{position:relative;overflow:hidden;background:linear-gradient(145deg,#d4d8ca,#b7c0ae 48%,#9ba994)}.hero-art:before{content:'';position:absolute;width:52%;height:115%;left:25%;top:-6%;border-radius:49% 49% 18% 18%;background:linear-gradient(100deg,#f1eadc,#d4c9b3 45%,#eee4d4);transform:rotate(4deg);box-shadow:40px 4px 0 -8px #778873}.hero-art:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 72% 32%,#fff7 0,transparent 27%),linear-gradient(100deg,transparent 45%,#606c5524 46%,transparent 55%)}.art-tag{position:absolute;z-index:1;right:25px;bottom:22px;background:#fffdfaeb;padding:10px 14px;font:14px var(--serif)}.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 0 20px}.section-head h2{font:500 28px var(--serif);margin:6px 0}.section-head p{margin:0;color:var(--muted);font-size:12px}.categories{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 23px}.chip{padding:9px 15px;border:1px solid var(--line);background:var(--white);border-radius:25px;color:#626159;font-size:11px}.chip.selected,.chip:hover{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 17px}.card{background:var(--white);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #32301c10}.photo{aspect-ratio:4/4.8;background:#eeece5;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo-placeholder{height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#f1efe8,#e8e5db);color:#777;font-size:11px}.card-info{padding:13px 14px 15px}.card-info .seller{color:var(--muted);font-size:10px;margin-bottom:5px}.card-info h3{font-size:13px;font-weight:500;margin:0 0 9px}.price{font-size:13px;font-weight:700}.empty{grid-column:1/-1;background:#efeee8;padding:58px 20px;text-align:center;border-radius:4px}.empty .symbol{font:36px var(--serif);color:#9aa28f}.empty h3{font:22px var(--serif);margin:10px 0}.empty p{font-size:12px;color:#77766f;margin:0 auto 18px;max-width:370px;line-height:1.7}.footer{margin-top:65px;background:#ebeae3;padding:34px 5vw;color:#727168;font-size:11px;display:flex;justify-content:space-between;gap:25px}.footer strong{font:19px var(--serif);color:var(--ink)}.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:var(--white)}.auth-art{background:#e8eae1;position:relative;overflow:hidden;display:grid;place-items:center;padding:10%}.auth-art:before{content:'';position:absolute;width:50%;height:90%;left:27%;bottom:-10%;border-radius:48% 48% 5% 5%;background:linear-gradient(110deg,#a88773,#ddc5ae 50%,#967760);transform:rotate(7deg)}.auth-quote{position:relative;z-index:1;align-self:start;max-width:410px;margin-top:12%;font:40px/1.2 var(--serif);color:var(--green)}.auth-panel{display:grid;place-items:center;padding:35px}.auth-box{width:min(100%,390px)}.auth-box h1{font:34px var(--serif);font-weight:500;margin:34px 0 8px}.auth-box>p{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 23px}.tabs{display:flex;border-bottom:1px solid var(--line);gap:24px}.tabs button{background:none;border:0;padding:12px 0;color:#96948c}.tabs button.active{color:var(--green);border-bottom:2px solid var(--green)}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:11px;font-weight:600;color:#5a5a52}.field input,.field select,.field textarea{width:100%;border:1px solid #e2dfd6;background:white;border-radius:3px;padding:11px 12px;font-size:12px;color:var(--ink)}.field textarea{min-height:95px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-error{color:#a54939;font-size:11px;line-height:1.5;margin:8px 0}.notice{padding:12px;background:#f1f2ec;color:#65705d;font-size:11px;line-height:1.6;border-radius:3px;margin:14px 0}.wide{width:100%}.detail{display:grid;grid-template-columns:1fr 1fr;gap:6%;padding:55px 0}.detail .photo{aspect-ratio:4/4.6}.detail-copy{padding:20px 0}.detail-copy h1{font:38px/1.15 var(--serif);font-weight:500;margin:12px 0}.detail-copy .price{font-size:20px;margin:20px 0}.detail-copy p{color:#717068;line-height:1.8;font-size:13px}.detail-seller{color:var(--muted);font-size:11px}.detail-actions{display:flex;gap:10px;margin:28px 0}.detail-actions>*{flex:1}.cart-layout{display:grid;grid-template-columns:1fr 320px;gap:25px}.cart-row{display:grid;grid-template-columns:90px 1fr auto;gap:17px;padding:15px;background:var(--white);border:1px solid var(--line);margin-bottom:10px;align-items:center}.cart-row img{width:90px;height:100px;object-fit:cover}.cart-row h3{font-weight:500;font-size:13px}.muted{color:var(--muted);font-size:11px}.summary{background:var(--white);border:1px solid var(--line);padding:21px;height:max-content}.summary h3{font:21px var(--serif);margin:0 0 20px}.sumline{display:flex;justify-content:space-between;margin:12px 0;color:#777;font-size:12px}.sumline.total{border-top:1px solid var(--line);padding-top:15px;color:var(--ink);font-weight:700;font-size:15px}.profile{display:grid;grid-template-columns:230px 1fr;gap:24px}.side-menu{background:var(--white);border:1px solid var(--line);padding:12px;height:max-content}.side-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;color:#69685f;font-size:12px}.side-menu button.active{background:#eef0e9;color:var(--green)}.panel{background:var(--white);border:1px solid var(--line);padding:27px}.panel h2{font:26px var(--serif);margin:0 0 7px}.panel>p{color:var(--muted);font-size:12px;margin:0 0 20px}.seller-layout{display:grid;grid-template-columns:1fr 1fr;gap:25px}.upload{border:1px dashed #c8c7bb;min-height:190px;display:grid;place-items:center;text-align:center;background:#f9f8f4;color:#85847c;font-size:11px;cursor:pointer}.upload img{max-width:100%;max-height:240px;object-fit:contain}.assistant-box{max-width:760px;margin:28px auto;background:var(--white);border:1px solid var(--line);padding:25px}.assistant-box h2{font:30px var(--serif);margin:0 0 6px}.chatlog{min-height:200px;max-height:340px;overflow:auto;padding:20px 0}.bubble{background:#eff0ea;padding:12px 15px;border-radius:4px;margin:8px 0;max-width:85%;font-size:12px;line-height:1.7}.bubble.mine{background:#e7eee4;margin-left:auto}.chatentry{display:flex;gap:9px}.chatentry input{flex:1;border:1px solid var(--line);padding:12px}.modal-back{position:fixed;inset:0;background:#1718138c;z-index:10;display:grid;place-items:center;padding:20px}.modal{background:var(--white);padding:26px;max-width:430px;width:100%;border-radius:5px}.modal h2{font:26px var(--serif)}.modal p{color:#6f6e66;font-size:12px;line-height:1.8}.close{float:right;border:0;background:none;font-size:21px;color:#777}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2e382e;color:#fff;padding:12px 19px;border-radius:3px;z-index:20;font-size:12px}.mobile-nav{display:none}
@media(max-width:950px){.header{gap:20px;padding:0 4vw}.nav{gap:13px}.nav button{font-size:12px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{min-height:300px}.shell{padding:0 4vw}}@media(max-width:680px){.topline{height:30px;font-size:9px}.header{height:63px;padding:0 17px;gap:13px}.brand{font-size:20px}.nav{display:none}.search{width:auto;flex:1}.search input{padding:10px 8px 10px 32px}.header-actions{gap:4px}.header-actions .iconbtn:nth-child(2){display:none}.shell{padding:0 17px}.hero{grid-template-columns:1fr;margin:17px 0 32px;min-height:0}.hero-copy{padding:32px 25px 26px}.hero h1{font-size:37px}.hero-art{height:195px}.hero-art:before{width:39%;left:29%}.art-tag{font-size:12px;right:13px;bottom:12px}.section-head h2{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card-info{padding:10px}.card-info h3{font-size:12px}.photo{aspect-ratio:4/4.8}.footer{margin-top:38px;padding:27px 18px;display:block;line-height:2}.auth{grid-template-columns:1fr}.auth-art{display:none}.auth-panel{padding:26px 23px}.auth-box h1{margin-top:29px}.detail{grid-template-columns:1fr;gap:0;padding:20px 0}.detail .photo{aspect-ratio:4/4.6;max-height:520px}.detail-copy{padding:7px 0}.detail-copy h1{font-size:31px}.detail-actions{margin:19px 0}.cart-layout{grid-template-columns:1fr}.profile{grid-template-columns:1fr;gap:10px}.side-menu{display:flex;overflow:auto}.side-menu button{white-space:nowrap;width:auto}.panel{padding:19px}.seller-layout{grid-template-columns:1fr}.cart-row{grid-template-columns:68px 1fr auto;gap:10px;padding:10px}.cart-row img{width:68px;height:78px}.field-row{grid-template-columns:1fr 1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffefa;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6;justify-content:space-around}.mobile-nav button{border:0;background:none;color:#77766e;font-size:9px;padding:4px}.mobile-nav button span{display:block;font-size:18px;margin-bottom:2px}.footer{padding-bottom:80px}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s), app=$('#app');let state={user:null,products:[],cart:[],page:'home',category:'All',search:'',authMode:'signup',profileTab:'account',currency:'INR',chat:[]};const cats=['All','Tops','Dresses','Kurtas','Sarees','Bottoms','Accessories'];
async function api(path,body){const r=await fetch('/api'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});const d=await r.json();if(!r.ok)throw Error(d.error||'Please try again.');return d}function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){const c=state.user?.currency||'INR';try{return new Intl.NumberFormat(c==='INR'?'en-IN':'en',{style:'currency',currency:c,maximumFractionDigits:0}).format(v)}catch{return '₹'+v}}function toast(s){const n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2600)}function photo(p){return `<div class="photo"><img src="${p.image}" alt="${esc(p.title)}" loading="lazy"></div>`}
function header(){return `<div class="topline">A wardrobe with a point of view · Made by independent sellers</div><header class="header"><div class="brand" onclick="go('home')">sthree <span>vastras</span></div><nav class="nav"><button class="${state.page==='home'?'active':''}" onclick="go('home')">For you</button><button onclick="go('assistant')">Tapun AI ✦</button><button onclick="go('seller')">Sell with us</button></nav><div class="search"><input placeholder="Search pieces, colours, styles…" value="${esc(state.search)}" oninput="search(this.value)" aria-label="Search products"></div><div class="header-actions"><button class="iconbtn" aria-label="Cart" onclick="go('cart')">♧<span class="count">${state.cart.reduce((n,x)=>n+x.quantity,0)}</span></button><button class="iconbtn" aria-label="Account settings" onclick="go('settings')">♙</button></div></header>`}
function footer(){return `<footer class="footer"><div><strong>sthree vastras</strong><br>Wear what feels like you.</div><div>Thoughtfully made. Independently sold.<br>Payments are completed securely with your chosen provider.</div><div>© 2026 Sthree Vastras</div></footer>`}
function mobileNav(){return `<nav class="mobile-nav"><button onclick="go('home')"><span>⌂</span>Discover</button><button onclick="go('assistant')"><span>✦</span>Tapun AI</button><button onclick="go('seller')"><span>＋</span>Sell</button><button onclick="go('cart')"><span>♧</span>Bag</button><button onclick="go('settings')"><span>♙</span>Account</button></nav>`}
function cards(items){if(!items.length)return `<div class="empty"><div class="symbol">✳</div><h3>${state.products.length?'No pieces found':'Your next favourite starts here.'}</h3><p>${state.products.length?'Try another category or search.':'Our independent designers will appear here as soon as they publish their first pieces. No sample products, just the real thing.'}</p>${state.user?.role==='seller'?'<button class="btn" onclick="go(\'seller\')">Publish your first piece</button>':''}</div>`;return `<div class="grid">${items.map(p=>`<article class="card" onclick="openProduct('${p.id}')">${photo(p)}<div class="card-info"><div class="seller">${esc(p.sellerName)} · ${esc(p.category)}</div><h3>${esc(p.title)}</h3><div class="price">${money(p.price)}</div></div></article>`).join('')}</div>`}
function home(){let items=state.products.filter(p=>(state.category==='All'||p.category===state.category)&&(!state.search||`${p.title} ${p.description} ${p.category} ${p.sellerName}`.toLowerCase().includes(state.search.toLowerCase())));return `<main class="shell"><section class="hero"><div class="hero-copy"><div class="eyebrow">The independent edit</div><h1>Wear a little<br>more you.</h1><p>Find thoughtful pieces from independent Indian designers. Every listing is made by a real seller, shared with care.</p><button class="btn" onclick="document.querySelector('#discover').scrollIntoView({behavior:'smooth'})">Explore the collection&nbsp; ↗</button></div><div class="hero-art"><div class="art-tag">Personal style, independent spirit</div></div></section><section id="discover"><div class="section-head"><div><div class="eyebrow">Shop independent</div><h2>Pieces with a story</h2><p>Discover what our community is making.</p></div><button class="linkbtn" onclick="go('seller')">Are you a designer? ↗</button></div><div class="categories">${cats.map(c=>`<button class="chip ${state.category===c?'selected':''}" onclick="category('${c}')">${c}</button>`).join('')}</div>${cards(items)}</section></main>${footer()}`}
function auth(){return `<main class="auth"><div class="auth-art"><div class="auth-quote">“Dress like you’re already the person you’re becoming.”</div></div><div class="auth-panel"><div class="auth-box"><div class="brand" onclick="go('home')">sthree <span>vastras</span></div><h1>${state.authMode==='signup'?'A little more you.':'Welcome back.'}</h1><p>${state.authMode==='signup'?'Join a community of independent style and thoughtful finds.':'Sign in to see your cart and discover new pieces.'}</p><div class="tabs"><button class="${state.authMode==='signup'?'active':''}" onclick="authMode('signup')">Create account</button><button class="${state.authMode==='login'?'active':''}" onclick="authMode('login')">Sign in</button></div><form id="authform"><div id="authfields">${state.authMode==='signup'?`<div class="field"><label>Your name</label><input name="name" placeholder="How should we call you?" autocomplete="name"></div><div class="field-row"><div class="field"><label>Email address</label><input name="email" type="email" required placeholder="you@example.com" autocomplete="email"></div><div class="field"><label>Current password (only needed to change email)</label><input name="password" type="password" autocomplete="current-password"></div><div class="field"><label>Phone number</label><input name="phone" type="tel" required placeholder="+91…" autocomplete="tel"></div></div><div class="field"><label>Password</label><input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div><div class="field"><label>I'm here to</label><select name="role"><option value="shopper">Discover and shop</option><option value="seller">Sell my own clothing</option></select></div><div class="field"><label>Preferred payment app (optional)</label><select name="paymentPreference"><option value="upi">Any UPI app</option><option value="gpay">Google Pay</option><option value="phonepe">PhonePe</option><option value="none">Choose later</option></select></div>`:`<div class="field"><label>Email address</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>`}</div><div id="autherror" class="form-error"></div><button class="btn wide">${state.authMode==='signup'?'Create my account':'Sign in'}</button></form><div class="notice">Payments happen through your chosen provider at checkout. We never ask for or store card, UPI PIN, or wallet passwords here.</div></div></div></main>`}
function settings(){return `<main class="shell" style="padding-top:38px;padding-bottom:25px"><div class="eyebrow">Your space</div><h1 style="font:34px var(--serif);margin:8px 0 23px">Account & settings</h1><div class="profile"><aside class="side-menu"><button class="active">Account details</button><button onclick="go('seller')">Seller studio</button><button onclick="logout()">Sign out</button></aside><section class="panel"><h2>Looking good, ${esc(state.user.name)}.</h2><p>Keep your details and display preferences up to date.</p><form id="settingsform"><div class="field"><label>Email address</label><input name="email" type="email" value="${esc(state.user.email)}" required><small class="muted">Changing email requires your current password.</small></div><div class="field"><label>Current password (only needed to change email)</label><input name="password" type="password" autocomplete="current-password"></div><div class="field"><label>Phone number</label><input name="phone" value="${esc(state.user.phone)}" type="tel" required></div><div class="field-row"><div class="field"><label>Language</label><select name="language"><option value="en" ${state.user.language==='en'?'selected':''}>English</option><option value="hi" ${state.user.language==='hi'?'selected':''}>हिन्दी</option></select></div><div class="field"><label>Display currency (symbol only)</label><select name="currency">${[['INR','Indian rupee (₹)'],['USD','US dollar ($)'],['EUR','Euro (€)'],['GBP','British pound (£)']].map(([c,n])=>`<option value="${c}" ${state.user.currency===c?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="field"><label>Preferred payment app</label><select name="paymentPreference"><option value="upi" ${(!state.user.paymentPreference||state.user.paymentPreference==='upi')?'selected':''}>Any UPI app</option><option value="gpay" ${state.user.paymentPreference==='gpay'?'selected':''}>Google Pay</option><option value="phonepe" ${state.user.paymentPreference==='phonepe'?'selected':''}>PhonePe</option><option value="none" ${state.user.paymentPreference==='none'?'selected':''}>Choose later</option></select></div><div id="settingerror" class="form-error"></div><button class="btn">Save preferences</button> <button type="button" class="btn light" onclick="logout()">Sign out</button></form><div class="notice">Payment preference is saved for convenience only; this app does not connect to Google Pay or PhonePe or store payment credentials. Product prices are set in Indian rupees. Currency changes the displayed symbol only, not the converted value.</div></section></div></main>${footer()}`}
function seller(){if(!state.user)return `<main class="shell" style="padding-top:45px;min-height:55vh"><div class="panel" style="max-width:600px;margin:auto"><div class="eyebrow">For independent makers</div><h2>Put your work out there.</h2><p>Create a seller account to publish real clothing pieces for shoppers to discover.</p><button class="btn" onclick="go('auth');authMode('signup')">Create a seller account</button></div></main>${footer()}`;if(state.user.role!=='seller')return `<main class="shell" style="padding:45px 0;min-height:55vh"><div class="panel" style="max-width:620px;margin:auto"><div class="eyebrow">Seller studio</div><h2>Ready to share your collection?</h2><p>Seller accounts are selected when creating an account. Sign out to create a separate seller account.</p><button class="btn light" onclick="logout()">Sign out</button></div></main>${footer()}`;return `<main class="shell" style="padding-top:36px;padding-bottom:30px"><div class="eyebrow">Seller studio</div><h1 style="font:34px var(--serif);margin:8px 0">Your work, out in the world.</h1><p class="muted" style="margin-bottom:25px">Published listings appear in the shared storefront for every shopper.</p><div class="seller-layout"><section class="panel"><h2>New listing</h2><p>Use your own product photo and accurate details.</p><form id="listingform"><label class="upload" id="drop"><span>＋<br><br>Choose a product photo<br><small>JPEG, PNG or WebP · up to 7 MB</small></span><input id="imagefile" type="file" accept="image/jpeg,image/png,image/webp" required hidden></label><div class="field"><label>Piece name</label><input name="title" maxlength="100" required placeholder="e.g. Hand-block printed cotton kurta"></div><div class="field-row"><div class="field"><label>Price (INR ₹)</label><input name="price" type="number" min="1" step="1" required placeholder="2400"></div><div class="field"><label>Category</label><select name="category">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></div></div><div class="field"><label>Description</label><textarea name="description" maxlength="1200" required placeholder="Tell shoppers about the fabric, fit, craft and care…"></textarea></div><div id="sellererror" class="form-error"></div><button class="btn">Publish listing</button></form></section><section><div class="section-head"><div><div class="eyebrow">Your collection</div><h2 style="font-size:23px">Published pieces</h2></div></div>${cards(state.products.filter(p=>p.sellerId===state.user.id))}</section></div></main>${footer()}`}
function cart(){let rows=state.cart.map(x=>({...x,product:state.products.find(p=>p.id===x.productId)})).filter(x=>x.product);const total=rows.reduce((n,x)=>n+x.product.price*x.quantity,0);return `<main class="shell" style="padding-top:34px;padding-bottom:30px"><div class="eyebrow">Your edit</div><h1 style="font:34px var(--serif);margin:8px 0 24px">Your bag <span class="muted">(${rows.reduce((n,x)=>n+x.quantity,0)} pieces)</span></h1>${rows.length?`<div class="cart-layout"><div>${rows.map(x=>`<article class="cart-row"><img src="${x.product.image}" alt="${esc(x.product.title)}"><div><h3>${esc(x.product.title)}</h3><div class="muted">${esc(x.product.sellerName)} · Qty ${x.quantity}</div><div class="price" style="margin-top:8px">${money(x.product.price*x.quantity)}</div></div><button class="linkbtn" onclick="removeCart('${x.product.id}')">Remove</button></article>`).join('')}</div><aside class="summary"><h3>Order summary</h3><div class="sumline"><span>Subtotal</span><span>${money(total)}</span></div><div class="sumline"><span>Shipping</span><span>Calculated at checkout</span></div><div class="sumline total"><span>Estimated total</span><span>${money(total)}</span></div><button class="btn wide" onclick="checkout()">Continue to checkout</button><p class="muted" style="line-height:1.7">Payment and delivery are confirmed directly with the seller. No payment credentials are stored here.</p><button class="linkbtn" onclick="go('home')">← Keep discovering</button></aside></div>`:`<div class="empty"><div class="symbol">♧</div><h3>Your bag is waiting for a find.</h3><p>Add a piece from an independent designer and it will be saved here.</p><button class="btn" onclick="go('home')">Explore the collection</button></div>`}</main>${footer()}`}
function assistant(){return `<main class="shell" style="padding-top:25px;padding-bottom:25px"><div class="assistant-box"><div class="eyebrow">Your personal style companion</div><h2>Hi, I'm Tapun ✦</h2><p class="muted">Tell me what you're looking for. I'll help you explore pieces currently listed by our sellers.</p><div id="chatlog" class="chatlog">${state.chat.map(x=>`<div class="bubble ${x.mine?'mine':''}">${esc(x.text)}</div>`).join('')||'<div class="bubble">I can help you find something from the pieces available in the shop. Try “show me dresses” or tell me what occasion you’re shopping for.</div>'}</div><form class="chatentry" onsubmit="ask(event)"><input id="askinput" placeholder="What would you love to wear?" aria-label="Ask Tapun"><button class="btn">Ask Tapun</button></form></div></main>${footer()}`}
function view(){if(!state.user){app.innerHTML=auth();bindAuth();return}let content=state.page==='settings'?settings():state.page==='seller'?seller():state.page==='cart'?cart():state.page==='assistant'?assistant():state.page==='product'?productPage():home();app.innerHTML=header()+content+mobileNav();bind()}
function productPage(){const p=state.products.find(x=>x.id===state.productId);if(!p){state.page='home';return home()}return `<main class="shell"><button class="linkbtn" onclick="go('home')">← Back to collection</button><section class="detail">${photo(p)}<div class="detail-copy"><div class="eyebrow">${esc(p.category)}</div><h1>${esc(p.title)}</h1><div class="detail-seller">Made and listed by ${esc(p.sellerName)}</div><div class="price">${money(p.price)}</div><p>${esc(p.description)}</p><div class="notice">A real piece, listed by its seller. Ask the seller about sizing, availability and delivery before ordering.</div><div class="detail-actions"><button class="btn" onclick="addCart('${p.id}')">Add to bag</button><button class="btn light" onclick="checkoutOne('${p.id}')">Buy now</button></div><div class="muted">No payment provider is connected yet.</div><div class="notice"><strong>Reviews</strong><br>No verified customer reviews yet. Reviews will appear once real buyers share their experience.</div></div></section></main>${footer()}`}
function bind(){const f=$('#settingsform');if(f)f.onsubmit=async e=>{e.preventDefault();try{const d=await api('/settings',Object.fromEntries(new FormData(f)));state.user=d.user;view();toast('Your preferences are saved.')}catch(x){$('#settingerror').textContent=x.message}};const l=$('#listingform');if(l){let image='';$('#imagefile').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>7*1024*1024){$('#sellererror').textContent='Choose a photo under 7 MB.';return}image=await resizeImage(file);$('#drop').innerHTML=`<img src="${image}" alt="Your product photo"><input id="imagefile" type="file" accept="image/jpeg,image/png,image/webp" hidden>`};l.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(l));b.image=image;try{await api('/products',b);await refresh();go('seller');toast('Your listing is live in the storefront.')}catch(x){$('#sellererror').textContent=x.message}}}}
function bindAuth(){const f=$('#authform');f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));try{const result=await api(state.authMode==='signup'?'/signup':'/login',d);state.user=result.user;state.currency=result.user.currency;await refresh();go('home');toast(state.authMode==='signup'?'Welcome to Sthree Vastras.':'You’re signed in.')}catch(x){$('#autherror').textContent=x.message}}}
async function resizeImage(file){return new Promise((ok,no)=>{const im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.82))};im.onerror=no;im.src=url})}
async function refresh(){const d=await api('/me');state.user=d.user;state.products=d.products;if(state.user){state.currency=state.user.currency;const c=await api('/cart');state.cart=c.cart.map(x=>({...x,product:state.products.find(p=>p.id===x.productId)})).filter(x=>x.product)}else state.cart=[]}
function go(p){state.page=p;window.scrollTo(0,0);view()}function category(c){state.category=c;view()}function search(v){state.search=v;const pos=window.scrollY;view();const x=$('.search input');if(x){x.focus();x.setSelectionRange(v.length,v.length)}window.scrollTo(0,pos)}function authMode(x){state.authMode=x;view()}function openProduct(id){state.productId=id;go('product')}
async function addCart(id){try{const d=await api('/cart',{productId:id});state.cart=d.cart.map(x=>({...x,product:state.products.find(p=>p.id===x.productId)}));view();toast('Added to your bag.')}catch(e){toast(e.message)}}async function removeCart(id){try{const d=await api('/cart',{productId:id,action:'remove'});state.cart=d.cart.map(x=>({...x,product:state.products.find(p=>p.id===x.productId)}));view()}catch(e){toast(e.message)}}function checkoutOne(id){addCart(id).then(()=>go('cart'))}function checkout(){showModal('Checkout with the seller',`Your estimated total is <strong>${money(state.cart.reduce((n,x)=>n+x.product.price*x.quantity,0))}</strong>. This shop does not yet have a connected payment or shipping provider, so no payment will be taken here. Contact each seller to confirm delivery and pay using a trusted provider.`, 'Got it')}
function showModal(title,text,button){const el=document.createElement('div');el.className='modal-back';el.innerHTML=`<div class="modal"><button class="close" onclick="this.closest('.modal-back').remove()">×</button><h2>${title}</h2><p>${text}</p><button class="btn" onclick="this.closest('.modal-back').remove()">${button}</button></div>`;document.body.append(el)}async function logout(){await api('/logout',{});state.user=null;state.products=[];state.cart=[];state.page='home';view();toast('You’re signed out.')}function ask(e){e.preventDefault();const v=$('#askinput').value.trim();if(!v)return;state.chat.push({mine:true,text:v});const words=v.toLowerCase(),found=state.products.filter(p=>`${p.title} ${p.description} ${p.category}`.toLowerCase().includes(words.split(' ').find(x=>['dress','dresses','kurta','saree','top','tops','cotton','silk'].includes(x))||'~~~'));state.chat.push({text:found.length?`I found ${found.length} piece${found.length===1?'':'s'} that might fit. ${found.slice(0,3).map(p=>`${p.title} by ${p.sellerName} for ${money(p.price)}`).join(' · ')}. Open the collection to take a closer look.`:state.products.length?`I couldn't find an exact match in the current listings. Try a category like dresses, sarees, kurtas or tops, or browse everything in the collection.`:'There are no seller listings yet, so I don’t have real pieces to recommend. Check back after our independent sellers publish their first items.'});view();$('#chatlog').scrollTop=$('#chatlog').scrollHeight}
async function boot(){try{await refresh()}catch{}if(!state.user){state.authMode='signup';state.page='auth'}view()}boot();
</script></body></html>
