<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f2">
<title>Sthree Vastras — Made to be yours</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
:root{--ink:#292722;--muted:#88847b;--paper:#f8f6f2;--white:#fff;--line:#e9e5de;--rose:#a34e59;--rose2:#f4e8e7;--olive:#68745b;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fbfaf8}.auth-art{background:linear-gradient(160deg,rgba(36,34,28,.06),rgba(68,43,43,.42)),url('https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=1400&q=85') center/cover;display:flex;align-items:flex-end;padding:8vw;color:white}.auth-art h1{font:600 clamp(38px,5vw,68px)/1.08 var(--serif);margin:0 0 14px}.auth-art p{font-size:15px;max-width:360px;line-height:1.7;opacity:.92}.auth-form{display:flex;justify-content:center;align-items:center;padding:44px 24px}.auth-box{width:min(100%,410px)}.brand{font:600 26px var(--serif);letter-spacing:-.6px}.brand em{font-style:normal;color:var(--rose)}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:700}.auth-box h2{font:600 37px var(--serif);margin:33px 0 8px}.sub{color:var(--muted);line-height:1.6;margin:0 0 25px}.field{display:block;margin:0 0 15px}.field span{display:block;font-size:12px;font-weight:600;margin-bottom:7px}.field input,.field select,.field textarea,.search input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rose)}.field textarea{min-height:95px;resize:vertical}.btn{border:0;border-radius:6px;padding:13px 18px;font-weight:600;transition:.18s}.btn-primary{background:var(--rose);color:white}.btn-primary:hover{background:#873d48;transform:translateY(-1px)}.btn-quiet{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn-dark{background:var(--ink);color:white}.btn-full{width:100%}.auth-switch{text-align:center;color:var(--muted);margin:20px 0}.text-btn{border:0;background:none;color:var(--rose);font-weight:700;padding:3px}.secure-note{font-size:11px;color:var(--muted);line-height:1.6;background:#f5f2ed;border-radius:6px;padding:12px 14px;margin:17px 0}.topbar{height:76px;background:#fbfaf8;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(5vw,24px);gap:35px;position:sticky;top:0;z-index:5}.topbar .brand{white-space:nowrap}.search{max-width:410px;flex:1;position:relative}.search input{background:#f3f0eb;border:0;border-radius:20px;padding:12px 16px 12px 42px}.search:before{content:'⌕';position:absolute;left:16px;top:5px;font-size:23px;color:var(--muted)}.nav{display:flex;align-items:center;gap:23px;margin-left:auto}.nav button{background:none;border:0;color:#5e5a53;padding:8px 0;font-size:13px}.nav button.active{color:var(--rose);font-weight:700}.iconbtn{position:relative}.count{background:var(--rose);color:white;border-radius:100%;font-size:9px;padding:2px 5px;position:absolute;top:-3px;margin-left:2px}.mobile-menu{display:none}.hero{margin:24px auto 0;max-width:1320px;padding:0 28px}.hero-inner{min-height:310px;background:linear-gradient(90deg,rgba(30,27,25,.7),rgba(30,27,25,.03)),url('https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=1800&q=85') center 40%/cover;border-radius:12px;color:white;display:flex;align-items:center;padding:48px 7%}.hero h1{font:600 clamp(36px,5vw,60px)/1.07 var(--serif);max-width:560px;margin:12px 0}.hero p{max-width:390px;line-height:1.7;color:#f0ece7}.hero .eyebrow{color:#f3c8c9}.hero .btn{margin-top:8px;background:white;color:var(--ink)}.section{max-width:1320px;padding:0 28px;margin:48px auto}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.section-head h2{font:600 30px var(--serif);margin:0 0 4px}.section-head p{margin:0;color:var(--muted)}.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.cat{height:140px;border:0;border-radius:9px;background:var(--rose2);color:#553d3d;text-align:left;padding:19px;display:flex;flex-direction:column;justify-content:end;overflow:hidden;position:relative}.cat:nth-child(2){background:#e9ece3}.cat:nth-child(3){background:#eee8df}.cat:nth-child(4){background:#e8e4ec}.cat:nth-child(5){background:#efe7dc}.cat:after{content:'✳';position:absolute;right:9px;top:-20px;font-size:100px;opacity:.11}.cat strong{font:600 20px var(--serif)}.cat small{margin-top:6px;color:#787169}.empty{border:1px dashed #d8d1c7;border-radius:9px;text-align:center;padding:55px 20px;background:#fbfaf8}.empty .symbol{font-size:28px;color:var(--rose)}.empty h3{font:600 24px var(--serif);margin:10px 0}.empty p{color:var(--muted);max-width:460px;margin:0 auto 18px;line-height:1.6}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}.product img{width:100%;height:280px;object-fit:cover;background:#eee}.product-info{padding:14px}.product-info strong{font:600 17px var(--serif)}.price{color:var(--rose);font-weight:700;margin-top:8px}.page{max-width:1120px;margin:44px auto;padding:0 26px}.page-title{font:600 36px var(--serif);margin:0 0 6px}.page-intro{color:var(--muted);margin:0 0 27px;line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:24px;margin-bottom:20px}.panel h3{font:600 22px var(--serif);margin:0 0 8px}.panel p{color:var(--muted);line-height:1.6}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.form-grid .wide{grid-column:1/-1}.preview{display:grid;grid-template-columns:1fr 1fr;gap:42px}.preview img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:#eee}.preview h1{font:600 38px var(--serif);margin:10px 0}.preview .price{font-size:21px}.cart-row{display:grid;grid-template-columns:88px 1fr auto;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.cart-row img{width:88px;height:100px;object-fit:cover;border-radius:5px;background:#eee}.cart-row h4{font:600 18px var(--serif);margin:0 0 8px}.cart-row p{color:var(--muted);margin:0}.total{display:flex;justify-content:space-between;padding:20px 0;font-size:18px;font-weight:700}.footer{border-top:1px solid var(--line);padding:25px 28px;text-align:center;color:var(--muted);font-size:11px;margin-top:70px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:white;padding:12px 18px;border-radius:7px;opacity:0;transition:.25s;z-index:10;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.assistant-box{display:flex;gap:10px}.assistant-box input{flex:1;padding:13px;border:1px solid var(--line);border-radius:6px}.muted{color:var(--muted)}
@media(max-width:800px){.auth{grid-template-columns:1fr}.auth-art{display:none}.auth-form{min-height:100vh}.topbar{height:65px;gap:12px;padding:0 16px}.topbar .brand{font-size:21px}.search{max-width:none}.nav{gap:13px}.nav button{font-size:12px}.nav .optional{display:none}.hero{padding:0 14px}.hero-inner{min-height:270px;padding:32px 25px;background-position:60%}.section{padding:0 16px;margin:36px auto}.categories{grid-template-columns:repeat(3,1fr)}.cat{height:120px}.products{grid-template-columns:repeat(2,1fr)}.product img{height:240px}.page{padding:0 16px;margin-top:30px}.preview{gap:20px}.preview h1{font-size:30px}}
@media(max-width:520px){.topbar{flex-wrap:wrap;height:auto;padding:13px 15px;gap:10px}.topbar .brand{font-size:20px}.search{order:3;flex-basis:100%}.nav{gap:14px}.nav button{font-size:11px}.nav .optional{display:none}.hero-inner{min-height:285px;border-radius:8px}.hero p{font-size:13px}.hero h1{font-size:39px}.section-head h2{font-size:26px}.categories{grid-template-columns:repeat(2,1fr)}.cat:last-child{display:none}.cat{height:110px;padding:14px}.cat strong{font-size:18px}.products{gap:10px}.product img{height:195px}.product-info{padding:10px}.product-info strong{font-size:15px}.page-title{font-size:31px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.panel{padding:18px}.preview{grid-template-columns:1fr}.preview img{max-height:55vh;aspect-ratio:1/1}.cart-row{grid-template-columns:66px 1fr auto;gap:12px}.cart-row img{width:66px;height:78px}.auth-form{padding:30px 23px}}
</style></head>
<body><div id="app"></div><div class="toast" id="toast"></div>
<script>
const app=document.getElementById('app');let currentUser=null,view='home',category='All',selectedProduct=null;let cart=JSON.parse(localStorage.getItem('sv-cart')||'[]');let products=JSON.parse(localStorage.getItem('sv-products')||'[]');let account=JSON.parse(localStorage.getItem('sv-account')||'null');let currency=localStorage.getItem('sv-currency')||'INR';let currencyFmt=new Intl.NumberFormat('en-IN',{style:'currency',currency,maximumFractionDigits:0});
const categories=['All','Tops','Dresses','Kurtas','Sarees','Accessories'];function money(n){try{return new Intl.NumberFormat(currency==='INR'?'en-IN':'en-US',{style:'currency',currency,maximumFractionDigits:0}).format(n)}catch{return '₹'+n}}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function save(){localStorage.setItem('sv-products',JSON.stringify(products));localStorage.setItem('sv-cart',JSON.stringify(cart))}
function render(){if(!currentUser){renderAuth();return}if(view==='product'){renderProduct();return}if(view==='cart'){renderCart();return}if(view==='seller'){renderSeller();return}if(view==='settings'){renderSettings();return}if(view==='assistant'){renderAssistant();return}renderHome()}
function renderAuth(){app.innerHTML=`<div class="auth"><div class="auth-art"><div><span class="eyebrow" style="color:#f3c8c9">A little more you</span><h1>Wear your<br>own story.</h1><p>Discover thoughtful fashion from independent creators and makers.</p></div></div><div class="auth-form"><form class="auth-box" id="authForm"><div class="brand">sthree <em>vastras</em></div><h2 id="authTitle">Welcome back</h2><p class="sub" id="authSub">Sign in to find something that feels like you.</p><label class="field"><span>Email address</span><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters"></label><div id="extraFields" class="hidden"><label class="field"><span>Phone number</span><input id="phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210"></label><label class="field"><span>UPI ID (optional)</span><input id="upi" type="text" placeholder="name@bank"></label><p class="secure-note">For your safety, never enter your UPI PIN, payment app password, or OTP here. This preview does not process payments.</p></div><button class="btn btn-primary btn-full" id="submitAuth">Sign in</button><p class="auth-switch"><span id="switchText">New to Sthree Vastras?</span> <button class="text-btn" type="button" id="switchAuth">Create an account</button></p><p class="muted" style="font-size:11px;line-height:1.5;text-align:center">Preview app: sign-in details stay on this device and are not verified by a server.</p></form></div></div>`;let signup=false;document.getElementById('switchAuth').onclick=()=>{signup=!signup;document.getElementById('authTitle').textContent=signup?'Create your account':'Welcome back';document.getElementById('authSub').textContent=signup?'Join us to discover independent fashion.':'Sign in to find something that feels like you.';document.getElementById('extraFields').classList.toggle('hidden',!signup);document.getElementById('submitAuth').textContent=signup?'Create account':'Sign in';document.getElementById('switchText').textContent=signup?'Already have an account?':'New to Sthree Vastras?';document.getElementById('switchAuth').textContent=signup?'Sign in':'Create an account'};document.getElementById('authForm').onsubmit=e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),pass=document.getElementById('password').value;if(signup){account={email,phone:document.getElementById('phone').value,upi:document.getElementById('upi').value};localStorage.setItem('sv-account',JSON.stringify(account));currentUser=account;toast('Account created on this device')}else if(account&&email!==account.email){toast('This preview only supports the account saved on this device');return}else{currentUser=account||{email,phone:'',upi:''};toast('Signed in to preview')}view='home';render()}}
function header(){return `<header class="topbar"><button class="brand" style="border:0;background:none;padding:0" onclick="go('home')">sthree <em style="color:var(--rose);font-style:normal">vastras</em></button><label class="search"><input id="searchInput" placeholder="Search styles, makers..."></label><nav class="nav"><button class="active" onclick="go('home')">For you</button><button class="optional" onclick="go('assistant')">Tapun AI</button><button class="optional" onclick="go('seller')">Sell with us</button><button class="iconbtn" onclick="go('cart')">Bag <span class="count">${cart.length}</span></button><button class="optional" onclick="go('settings')">Settings</button></nav></header>`}
function shell(content){app.innerHTML=header()+content+`<footer class="footer">Sthree Vastras · Independent style, thoughtfully found<br><span style="display:block;margin-top:7px">Preview experience · No real payments are processed</span></footer>`;let s=document.getElementById('searchInput');s.oninput=()=>{let q=s.value.toLowerCase();document.querySelectorAll('.product').forEach(p=>p.classList.toggle('hidden',!p.dataset.search.includes(q)))}}
function renderHome(){let filtered=products.filter(p=>(category==='All'||p.category===category));shell(`<main><section class="hero"><div class="hero-inner"><div><div class="eyebrow">Fashion, with a point of view</div><h1>Made to be<br>yours.</h1><p>Find pieces that tell your story, from independent designers and local makers.</p><button class="btn" onclick="go('seller')">Meet the makers&nbsp; ↗</button></div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Explore your way</div><h2>Find your feeling</h2></div></div><div class="categories">${['Tops','Dresses','Kurtas','Sarees','Accessories'].map(c=>`<button class="cat" onclick="setCategory('${c}')"><strong>${c}</strong><small>Explore ${c.toLowerCase()} →</small></button>`).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Thoughtfully selected</div><h2>${category==='All'?'Discover the collection':category}</h2><p>Pieces listed by sellers on Sthree Vastras</p></div><button class="text-btn" onclick="setCategory('All')">View all</button></div>${filtered.length?`<div class="products">${filtered.map(p=>`<article class="product" data-search="${(p.name+' '+p.description+' '+p.category).toLowerCase()}" onclick="openProduct('${p.id}')"><img src="${p.image}" alt="${esc(p.name)}"><div class="product-info"><strong>${esc(p.name)}</strong><div class="muted" style="margin-top:5px">${esc(p.category)} · ${esc(p.seller||'Independent maker')}</div><div class="price">${money(+p.price)}</div></div></article>`).join('')}</div>`:`<div class="empty"><div class="symbol">✳</div><h3>No pieces listed yet</h3><p>Our collection is ready for its first maker. Browse again when sellers add their own real pieces, or open a developer account to list yours.</p><button class="btn btn-primary" onclick="go('seller')">Open a developer account</button></div>`}</section></main>`)}
function setCategory(c){category=c;renderHome()}function go(v){view=v;render()}function openProduct(id){selectedProduct=products.find(p=>p.id===id);if(selectedProduct){view='product';render()}}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderProduct(){let p=selectedProduct;if(!p)return go('home');shell(`<main class="page"><button class="text-btn" onclick="go('home')">← Back to collection</button><div class="preview" style="margin-top:20px"><img src="${p.image}" alt="${esc(p.name)}"><div><div class="eyebrow">${esc(p.category)} · ${esc(p.seller||'Independent maker')}</div><h1>${esc(p.name)}</h1><div class="price">${money(+p.price)}</div><p style="line-height:1.8;margin:20px 0;color:#68635c">${esc(p.description)}</p><div class="panel" style="padding:17px"><strong>Details</strong><p style="margin:8px 0 0">Sold by ${esc(p.seller||'Independent maker')}<br>Authenticity and quality are the seller's responsibility.</p></div><button class="btn btn-primary" onclick="addCart('${p.id}')">Add to bag</button> <button class="btn btn-dark" onclick="addCart('${p.id}');go('cart')">Buy now</button><p class="muted" style="font-size:11px">No checkout or payment processing in this preview.</p></div></div></main>`)}
function addCart(id){cart.push(id);save();toast('Added to your bag');render()}
function renderCart(){let items=cart.map(id=>products.find(p=>p.id===id)).filter(Boolean),total=items.reduce((a,p)=>a+(+p.price||0),0);shell(`<main class="page"><div class="eyebrow">Your picks</div><h1 class="page-title">Your bag</h1><p class="page-intro">${items.length?`${items.length} ${items.length===1?'piece':'pieces'} saved for later`:''}</p>${items.length?`<div class="panel">${items.map((p,i)=>`<div class="cart-row"><img src="${p.image}" alt="${esc(p.name)}"><div><h4>${esc(p.name)}</h4><p>${esc(p.category)} · ${esc(p.seller||'Independent maker')}</p><div class="price">${money(+p.price)}</div></div><button class="text-btn" onclick="removeCart(${i})">Remove</button></div>`).join('')}<div class="total"><span>Total</span><span>${money(total)}</span></div><button class="btn btn-primary btn-full" onclick="toast('Checkout is not enabled in this preview')">Continue to checkout</button><p class="muted" style="font-size:11px;text-align:center">This preview does not process payments or create orders.</p></div>`:`<div class="empty"><div class="symbol">♡</div><h3>Your bag is waiting</h3><p>When you find a piece you love, add it here. Your total will appear once you add something.</p><button class="btn btn-primary" onclick="go('home')">Explore the collection</button></div>`}</main>`)}function removeCart(i){cart.splice(i,1);save();render()}
function renderSeller(){shell(`<main class="page"><div class="eyebrow">For independent makers</div><h1 class="page-title">Your developer account</h1><p class="page-intro">List your own clothing and manage your products. Your listings appear in the collection after you publish.</p><div class="panel"><h3>Seller profile</h3><p>Use a name shoppers will recognize as your store.</p><label class="field"><span>Store or maker name</span><input id="sellerName" placeholder="e.g. Asha Studio"></label></div><div class="panel"><h3>Add a clothing listing</h3><p>Upload your own product photo and provide accurate details and pricing.</p><form id="productForm"><div class="form-grid"><label class="field"><span>Product name</span><input id="pname" required maxlength="80" placeholder="Name this piece"></label><label class="field"><span>Category</span><select id="pcat">${categories.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></label><label class="field"><span>Price (${currency})</span><input id="pprice" type="number" min="1" step="1" required placeholder="0"></label><label class="field"><span>Product photo</span><input id="pimage" type="file" accept="image/*" required></label><label class="field wide"><span>Description</span><textarea id="pdesc" required maxlength="1000" placeholder="Fabric, fit, care details, and what makes it special"></textarea></label></div><button class="btn btn-primary">Publish listing</button></form></div><div class="panel"><h3>Your listings</h3>${products.filter(p=>p.owner===currentUser.email).length?products.filter(p=>p.owner===currentUser.email).map(p=>`<div class="cart-row"><img src="${p.image}" alt=""><div><h4>${esc(p.name)}</h4><p>${esc(p.category)}</p><div class="price">${money(+p.price)}</div></div><button class="text-btn" onclick="deleteProduct('${p.id}')">Remove</button></div>`).join(''):`<p>You have not listed anything yet. Nothing is preloaded or represented as a real product.</p>`}</div></main>`);document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();let file=document.getElementById('pimage').files[0];if(!file)return;let image=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});let seller=document.getElementById('sellerName').value.trim()||currentUser.email.split('@')[0];let p={id:crypto.randomUUID(),name:document.getElementById('pname').value.trim(),category:document.getElementById('pcat').value,price:+document.getElementById('pprice').value,description:document.getElementById('pdesc').value.trim(),image,seller,owner:currentUser.email};products.push(p);save();toast('Listing published');render()}}
function deleteProduct(id){products=products.filter(p=>p.id!==id);cart=cart.filter(i=>i!==id);save();render()}
function renderSettings(){shell(`<main class="page"><div class="eyebrow">Your account</div><h1 class="page-title">Settings</h1><p class="page-intro">Manage your profile and preferences.</p><div class="panel"><h3>Contact details</h3><div class="form-grid"><label class="field"><span>Email</span><input id="setEmail" type="email" value="${esc(currentUser.email||'')}"></label><label class="field"><span>Phone number</span><input id="setPhone" type="tel" value="${esc(currentUser.phone||'')}"></label><label class="field wide"><span>UPI ID (optional)</span><input id="setUpi" value="${esc(currentUser.upi||'')}" placeholder="name@bank"></label></div><p class="secure-note">Never store or share your UPI PIN, payment app password, or OTP. This preview does not connect to a payment provider.</p><button class="btn btn-primary" onclick="saveSettings()">Save changes</button></div><div class="panel"><h3>Preferences</h3><label class="field"><span>Currency</span><select id="currency" onchange="changeCurrency(this.value)"><option value="INR" ${currency==='INR'?'selected':''}>Indian rupees (₹ INR)</option><option value="USD" ${currency==='USD'?'selected':''}>US dollars ($ USD)</option><option value="EUR" ${currency==='EUR'?'selected':''}>Euros (€ EUR)</option><option value="GBP" ${currency==='GBP'?'selected':''}>Pounds (£ GBP)</option></select></label><label class="field"><span>Language</span><select id="language" onchange="localStorage.setItem('sv-language',this.value);toast('Language preference saved for this preview')"><option>English</option><option>हिन्दी</option><option>தமிழ்</option><option>বাংলা</option></select></label></div><button class="btn btn-quiet" onclick="logout()">Log out</button></main>`)}function saveSettings(){currentUser.email=document.getElementById('setEmail').value.trim();currentUser.phone=document.getElementById('setPhone').value.trim();currentUser.upi=document.getElementById('setUpi').value.trim();localStorage.setItem('sv-account',JSON.stringify(currentUser));toast('Details updated on this device')}function changeCurrency(v){currency=v;localStorage.setItem('sv-currency',v);render()}function logout(){currentUser=null;view='home';render()}
function renderAssistant(){shell(`<main class="page"><div class="eyebrow">Your style companion</div><h1 class="page-title">Meet Tapun</h1><p class="page-intro">Ask for ideas to make finding your next favorite piece a little easier.</p><div class="panel"><h3>What are you looking for?</h3><p>Try “help me find a breezy outfit for summer” or “what details should I look for in a cotton kurta?”</p><form id="askForm" class="assistant-box"><input id="ask" placeholder="Tell Tapun what you have in mind..."><button class="btn btn-primary">Ask</button></form><div id="answer" class="secure-note hidden" style="margin-top:18px"></div><p class="muted" style="font-size:11px;margin-bottom:0">Tapun preview offers general style prompts only. It does not place orders or verify product details.</p></div><button class="btn btn-quiet" onclick="go('home')">Browse listed pieces</button></main>`);document.getElementById('askForm').onsubmit=e=>{e.preventDefault();let q=document.getElementById('ask').value.trim();if(!q)return;let a=document.getElementById('answer');a.textContent=products.length?`For “${q}”, try browsing the ${[...new Set(products.map(p=>p.category))].join(', ')} pieces currently listed. Check each seller's fabric, fit, and care information before buying.`:`For “${q}”, start with the fabric, fit, and occasion you have in mind. No items are listed yet, but you can check back once makers publish their pieces.`;a.classList.remove('hidden')}}
render();
</script></body></html>
